[package]
name = "jpeg-decoder"
version = "0.3.2"
edition = "2021"
rust-version = "1.61.0"
license = "MIT OR Apache-2.0"
description = "JPEG decoder"
authors = ["The image-rs Developers"]
readme = "README.md"
documentation = "https://docs.rs/jpeg-decoder"
repository = "https://github.com/image-rs/jpeg-decoder"

[dependencies]
rayon = { version = "1.5.1", optional = true }

[features]
default = ["rayon"]
platform_independent = []
nightly_aarch64_neon = []
# Exercise the ESP-IDF single-worker path in host tests; ordinary host builds
# retain the upstream worker selection. ESP-IDF uses it regardless of features.
force-immediate = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("asmjs"))'] }
