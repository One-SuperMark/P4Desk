[workspace]
resolver = "2"
members = [
    "crates/tiny-flutter",
    "crates/tiny-flutter/crates/tiny_gfx",
    "crates/p4desk-protocol",
    "apps/app-launcher",
    "apps/calculator",
    "tools/fontpack",
    "firmware/components/rust_main",
]
exclude = ["apps/counter", "apps/hello", "apps/terminal", "apps/music-player"]
default-members = ["crates/p4desk-protocol", "apps/app-launcher", "tools/fontpack"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The UI's pixel and coverage loops are latency-sensitive. Keep the rest of
# the firmware compact while optimizing the shared renderer for speed.
[profile.release.package.tiny_gfx]
opt-level = 3

[profile.release.package.tiny-flutter]
opt-level = 3
