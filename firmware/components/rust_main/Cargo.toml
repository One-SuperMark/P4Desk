[package]
name = "rust_main"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
app-launcher = { path = "../../../apps/app-launcher", default-features = false }
tiny-flutter = { path = "../../../crates/tiny-flutter", default-features = false }
p4desk-protocol = { path = "../../../crates/p4desk-protocol" }
serde_json = "1"

[target.'cfg(target_os = "espidf")'.dependencies]
libc = "0.2"
esp-idf-sys = { version = "=0.38.1", default-features = false, features = ["std", "native"] }

[build-dependencies]
embuild = { version = "=0.33.5", features = ["espidf"] }

[package.metadata.esp-idf-sys]
esp-idf-version = "v6.0.2"
